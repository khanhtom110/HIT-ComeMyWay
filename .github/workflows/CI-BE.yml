name: CI/CD Pipeline
on:
  push:
    branches:
      - deploy # <-- ĐỔI NHÁNH BẰNG TAY Ở ĐÂY (ví dụ: main)
    paths:
      - 'backend/**'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - deploy # <-- ĐỔI NHÁNH BẰNG TAY Ở ĐÂY NỮA
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate Code Formatting
        run: mvn -T 2C --batch-mode formatter:validate

      - name: Build and Skip Test
        run: mvn -T 2C --batch-mode package -DskipTests

      # ---------------- PHẦN DEPLOY LÊN AWS ----------------

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        if: github.event_name == 'push'
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/target/comemyway-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.EC2_USERNAME }}/app/"
          strip_components: 2

      - name: Execute and Run JAR on EC2
        uses: appleboy/ssh-action@v1.0.3
        if: github.event_name == 'push'
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/app/
            
            pid=$(pgrep -f comemyway-0.0.1-SNAPSHOT.jar)
            if [ -n "$pid" ]; then
              echo "Stopping old app..."
              kill -9 $pid
            fi
            
            nohup java -jar comemyway-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            echo "Deployed successfully!"