jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate Code Formatting
        run: mvn -T 2C --batch-mode formatter:validate

      - name: Build and Skip Test
        run: mvn -T 2C --batch-mode verify -DskipTests