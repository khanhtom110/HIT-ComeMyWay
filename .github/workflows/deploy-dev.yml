name: Auto Deploy Dev to EC2

on:
  push:
    branches:
      - dev   # Tự động kích hoạt khi push hoặc merge PR vào nhánh dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo code mới nhất từ repository về máy ảo GitHub Actions
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Đóng gói ứng dụng thành file .jar bằng Maven (bỏ qua unit test để deploy nhanh)
      - name: Build with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Copy file comemyway-0.0.1-SNAPSHOT.jar sang thư mục ~/deploy-aws trên EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "backend/target/comemyway-0.0.1-SNAPSHOT.jar"
          target: "~/deploy-aws/"
          strip_components: 2

      # 5. SSH vào EC2 để dừng app cũ và khởi chạy app mới trong ~/deploy-aws
      - name: Restart App on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd ~/deploy-aws
            
            # Kiểm tra và dừng tiến trình app cũ nếu đang chạy
            PID=$(pgrep -f 'comemyway-.*\.jar' || true)
            if [ -n "$PID" ]; then
              echo "Stopping running process: $PID"
              kill -9 $PID
            fi

            # Khởi chạy bản .jar mới dưới dạng tiến trình nền
            echo "Starting new app version..."
            nohup java -jar commyway-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            sleep 2
            echo "Deployed Successfully!"