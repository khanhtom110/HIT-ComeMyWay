services:
  nodejs:
    image: comemyway-nodejs:dev
    build:
      context: ./backend-nodejs
    ports:
      - "${NODE_HTTP_PORT:-3000}:3000"
    env_file:
      - path: ./backend-nodejs/.env
        format: raw
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DB_HOST: "${DOCKER_DB_HOST:-host.docker.internal}"
      DB_PORT: "${DOCKER_DB_PORT:-3306}"
      DB_NAME: "${DOCKER_DB_NAME:-pet_heartbeat_db}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
